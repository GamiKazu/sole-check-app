name: Repository Activity Keep Alive

on:
  schedule:
    - cron: "17 18 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-repository-active:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update activity marker
        run: |
          mkdir -p .github
          echo "Last automated repository activity: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" > .github/repository-activity.txt

      - name: Commit activity marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/repository-activity.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: keep scheduled workflows active"
          git push
