name: Streamlit Keep Alive

on:
  schedule:
    # 6時間ごとに実行（UTC基準）
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keep-streamlit-awake:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit app
        run: |
          curl -L             --fail             --silent             --show-error             --retry 3             --retry-delay 10             --max-time 60             -A "Mozilla/5.0 GitHub-Actions-KeepAlive"             "https://sole-check-app-xcf3vnsxvuqiqszhaqmyqm.streamlit.app/"             -o /dev/null

          echo "Streamlit app ping completed at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
