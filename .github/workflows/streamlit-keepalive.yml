name: Streamlit Keep Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-streamlit-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Install Chromium browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Open Streamlit app
        env:
          STREAMLIT_URL: https://sole-check-app-xcf3vnsxvuqiqszhaqmyqm.streamlit.app/
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              const response = await page.goto(process.env.STREAMLIT_URL, {
                waitUntil: 'domcontentloaded',
                timeout: 90000
              });
              console.log('HTTP status:', response?.status());
              console.log('Browser URL:', page.url());

              if (new URL(page.url()).hostname !== new URL(process.env.STREAMLIT_URL).hostname) {
                throw new Error('Redirected away from Streamlit app');
              }

              await page.locator('[data-testid="stAppViewContainer"]').waitFor({
                state: 'visible',
                timeout: 90000
              });
              await page.getByText('足裏タイプ診断').first().waitFor({
                state: 'visible',
                timeout: 30000
              });

              console.log('SUCCESS: Streamlit app is visible');
              await page.waitForTimeout(10000);
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
