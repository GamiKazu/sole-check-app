
name: Streamlit Keep Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keep-streamlit-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check Streamlit response
        shell: bash
        run: |
          URL="https://sole-check-app-xcf3vnsxvuqiqszhaqmyqm.streamlit.app/_stcore/health"

          curl --silent --show-error \
            --dump-header response-headers.txt \
            --output /dev/null \
            --max-time 60 \
            --write-out "HTTP status: %{http_code}\nRedirect URL: %{redirect_url}\n" \
            "$URL"

          echo "Response headers:"
          cat response-headers.txt

          STATUS=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' response-headers.txt)

          if [[ "$STATUS" =~ ^2[0-9][0-9]$ ]]; then
            echo "HTTP request successful"
          elif [[ "$STATUS" =~ ^3[0-9][0-9]$ ]]; then
            echo "::warning::Streamlit returned a redirect. Inspect Location header."
          else
            echo "::error::Unexpected HTTP status: $STATUS"
            exit 1
          fi
