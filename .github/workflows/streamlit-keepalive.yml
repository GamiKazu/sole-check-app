name: Streamlit Keep Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-streamlit-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Install Chromium browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Connect to Streamlit app
        env:
          STREAMLIT_URL: https://sole-check-app-xcf3vnsxvuqiqszhaqmyqm.streamlit.app/
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });

            try {
              const page = await browser.newPage();

              let websocketConnected = false;
              let websocketReceived = false;
              let websocketErrors = 0;

              page.on('websocket', ws => {
                if (ws.url().includes('_stcore/stream')) {
                  websocketConnected = true;
                  console.log('Streamlit WebSocket opened:', ws.url());

                  ws.on('framereceived', () => {
                    websocketReceived = true;
                  });

                  ws.on('socketerror', error => {
                    websocketErrors++;
                    console.log('WebSocket error:', error);
                  });
                }
              });

              const response = await page.goto(
                process.env.STREAMLIT_URL,
                {
                  waitUntil: 'domcontentloaded',
                  timeout: 90000
                }
              );

              console.log('HTTP status:', response?.status());
              console.log('Browser URL:', page.url());

              if (
                new URL(page.url()).hostname !==
                new URL(process.env.STREAMLIT_URL).hostname
              ) {
                throw new Error('Redirected away from Streamlit app');
              }

              if (!response || response.status() !== 200) {
                throw new Error('Streamlit HTTP response was not 200');
              }

              console.log('Waiting for Streamlit WebSocket...');

              await page.waitForFunction(
                () => {
                  return performance.getEntriesByType('resource')
                    .some(entry => entry.name.includes('_stcore'));
                },
                { timeout: 30000 }
              ).catch(() => {
                console.log('Resource check timed out; checking WebSocket events');
              });

              await page.waitForTimeout(30000);

              console.log('WEBSOCKET CONNECTED:', websocketConnected);
              console.log('WEBSOCKET RECEIVED:', websocketReceived);
              console.log('WEBSOCKET ERRORS:', websocketErrors);

              if (!websocketConnected || !websocketReceived) {
                throw new Error(
                  'Streamlit WebSocket communication was not confirmed'
                );
              }

              if (websocketErrors > 0) {
                throw new Error('Streamlit WebSocket reported errors');
              }

              console.log('SUCCESS: Streamlit connection confirmed');

            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
