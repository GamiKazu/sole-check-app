
name: Streamlit Keep Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-streamlit-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Install Chromium browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Diagnose Streamlit connection
        env:
          STREAMLIT_URL: https://sole-check-app-xcf3vnsxvuqiqszhaqmyqm.streamlit.app/
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            try {
              const page = await browser.newPage();

              let wsCount = 0;
              let wsConnected = false;
              let wsErrors = 0;

              page.on('websocket', ws => {
                wsCount++;
                console.log('WEBSOCKET OPEN:', ws.url());

                ws.on('framesent', frame => {
                  console.log('WEBSOCKET FRAME SENT');
                });

                ws.on('framereceived', frame => {
                  wsConnected = true;
                  console.log('WEBSOCKET FRAME RECEIVED');
                });

                ws.on('socketerror', error => {
                  wsErrors++;
                  console.log('WEBSOCKET ERROR:', error);
                });

                ws.on('close', () => {
                  console.log('WEBSOCKET CLOSED');
                });
              });

              page.on('pageerror', error => {
                console.log('PAGE ERROR:', error.message);
              });

              page.on('requestfailed', request => {
                console.log(
                  'REQUEST FAILED:',
                  request.url(),
                  request.failure()?.errorText
                );
              });

              const response = await page.goto(
                process.env.STREAMLIT_URL,
                {
                  waitUntil: 'domcontentloaded',
                  timeout: 90000
                }
              );

              console.log('HTTP STATUS:', response?.status());
              console.log('BROWSER URL:', page.url());

              await page.waitForTimeout(30000);

              console.log('WEBSOCKET COUNT:', wsCount);
              console.log('WEBSOCKET RECEIVED:', wsConnected);
              console.log('WEBSOCKET ERRORS:', wsErrors);

              const appVisible = await page.locator(
                '[data-testid="stAppViewContainer"]'
              ).isVisible().catch(() => false);

              console.log('APP VISIBLE:', appVisible);

              const bodyText = await page.locator(
                'body'
              ).innerText().catch(() => '');

              console.log(
                'PAGE BODY:',
                bodyText.slice(0, 1500)
              );

              if (!appVisible) {
                throw new Error(
                  'Streamlit app did not render. Check WebSocket logs.'
                );
              }

              console.log(
                'SUCCESS: Streamlit app rendered'
              );

            } finally {
              await browser.close();
            }

          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
